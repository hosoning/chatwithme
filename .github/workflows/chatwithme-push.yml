name: ChatWithMe proactive push

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatwithme-push.yml'
      - '.github/scripts/send-chat-push.cjs'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FORCE_PUSH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save firebase-admin@13
      - run: node .github/scripts/send-chat-push.cjs
